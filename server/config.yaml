server:
  port: 3000

cors:
  origin: ''

database:
  type: 'better-sqlite3'
  database: 'database.sqlite'

google:
  clientId: ''
  clientSecret: ''
  callbackUrl: 'http://localhost:3000/api/auth/google/callback'

jwt:
  secret: 'change-me-in-config-local-yaml'
  expiresIn: '7d'

# Web Push (VAPID). Generate real keys and put them in config.local.yaml:
#   npx web-push generate-vapid-keys
# When publicKey is empty, push is disabled gracefully.
vapid:
  subject: 'mailto:admin@example.com'
  publicKey: ''
  privateKey: ''

rateLimiter:
  maxCreatesPerMinute: 60

storage:
  maxBytesPerUser: 52428800
