server:
  port: 3000

# Public, externally-reachable base URL (scheme + host, no trailing slash), e.g.
# 'https://lista-zadan.example.com'. Used as the OAuth issuer and to build the MCP
# discovery documents. Leave empty to derive it from the request (honouring the
# reverse proxy's X-Forwarded-Proto/Host) — set it explicitly in production.
app:
  publicUrl: ''

cors:
  origin: ''

database:
  type: 'better-sqlite3'
  database: 'database.sqlite'

google:
  clientId: ''
  clientSecret: ''
  callbackUrl: 'http://localhost:3000/api/auth/google/callback'

jwt:
  secret: 'change-me-in-config-local-yaml'
  expiresIn: '7d'

# Web Push (VAPID). Generate real keys and put them in config.local.yaml:
#   npx web-push generate-vapid-keys
# When publicKey is empty, push is disabled gracefully.
vapid:
  subject: 'mailto:admin@example.com'
  publicKey: ''
  privateKey: ''

rateLimiter:
  maxCreatesPerMinute: 60

storage:
  maxBytesPerUser: 52428800
